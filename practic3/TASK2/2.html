<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task3_2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            padding: 40px 30px;
            color: #000;
            line-height: 1.3;
        }

        .page {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2em;
            font-weight: bold;
            margin: 0.67em 0 0.4em 0;
        }

        h2 {
            font-size: 1.5em;
            font-weight: bold;
            margin: 0.83em 0 0.4em 0;
        }

        h3 {
            font-size: 1.17em;
            font-weight: bold;
            margin: 1em 0 0.4em 0;
        }

        h4 {
            font-size: 1em;
            font-weight: bold;
            margin: 1.33em 0 0.4em 0;
        }

        h5 {
            font-size: 0.83em;
            font-weight: bold;
            margin: 1.67em 0 0.4em 0;
        }

        h6 {
            font-size: 0.67em;
            font-weight: bold;
            margin: 2.33em 0 0.4em 0;
        }

        .plain-text {
            font-size: 1rem;
            font-weight: normal;
            margin: 1.2em 0 0 0;
            font-family: inherit;
        }

        .plain-text,
        h1, h2, h3, h4, h5, h6 {
            transition: none;
        }
        
        .page > :first-child {
            margin-top: 0;
        }
    </style>
</head>
<body>
<div class="page">
    <!-- Точное соответствие рисунку: каждый заголовок со своим текстом -->
    <h1>Это заголовок первого уровня</h1>
    <h2>Это заголовок второго уровня</h2>
    <h3>Это заголовок третьего уровня</h3>
    <h4>Это заголовок четвертого уровня</h4>
    <h5>Это заголовок пятого уровня</h5>
    <h6>Это заголовок шестого уровня</h6>
    <div class="plain-text">Это просто текст</div>
</div>
</body>
</html>
