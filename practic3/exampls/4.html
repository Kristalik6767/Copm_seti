<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Многоуровневый список</title>
    <style>
        ul {
            list-style-type: square;
        }
    </style>
  </head>
  <body>
    <h1>Разделы курса</h1>
    <ol>
      <li>
        Теги заголовков
        <!-- тип нумерации - латинские буквы (a, b, c, ...) -->
        <ol type="a">
          <li>h1</li>
          <li>h2</li>
          <!-- добавьте элементы вложенного списка для первого задания сюда -->
          <li>h3</li>
          <li>h4</li>
        </ol>
      </li>
      <li>
        Теги списков
        <!-- добавьте вложенный список для второго задания сюда -->
        <ul>
          <li>Неупорядоченный список (ul)</li>
          <li>Упорядоченный список (ol)</li>
        </ul>
      </li>
      <li>Теги форм</li>
    </ol>
  </body>
</html>
