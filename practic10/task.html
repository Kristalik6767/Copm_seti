<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма регистрации</title>
</head>
<body>

<h2>Форма регистрации</h2>

<form action="#" method="post">

    <p>Имя: <input type="text" name="name" size="30"></p>

    <p>E-mail: <input type="email" name="email" size="30"></p>

    <p>Пароль: <input type="password" name="password" size="30"></p>

    <p>Повтор пароля: <input type="password" name="confirm_password" size="30"></p>

    <p>Пол:<br>
    <input type="radio" name="gender" value="male"> мужской<br>
    <input type="radio" name="gender" value="female"> женский
    </p>

    <p>Увлечения:<br>
    <input type="checkbox" name="hobby" value="computers"> компьютеры<br>
    <input type="checkbox" name="hobby" value="sport"> спорт<br>
    <input type="checkbox" name="hobby" value="games"> игры<br>
    <input type="checkbox" name="hobby" value="animals"> животные<br>
    <input type="checkbox" name="hobby" value="cars"> автомобили<br>
    <input type="checkbox" name="hobby" value="clubs"> клубы<br>
    <input type="checkbox" name="hobby" value="music"> музыка
    </p>

    <p>Ваши пожелания:<br>
    <textarea name="wishes" rows="5" cols="40"></textarea>
    </p>

    <p>
    <input type="submit" value="Отправить">
    <input type="reset" value="Очистить">
    </p>

</form>

</body>
</html>
