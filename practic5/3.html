<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница 3 - замыкание кольца</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef3f0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 2rem;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 12px 28px rgba(0,0,0,0.1);
            border: 1px solid #cfe2cf;
        }
        h1 {
            color: #2d6a4f;
            font-size: 2rem;
        }
        .ring-link {
            margin: 1.8rem 0;
            background: #e0f2e9;
            padding: 0.8rem;
            border-radius: 60px;
        }
        a {
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            background: #d1f0de;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            transition: 0.2s;
        }
        a:hover {
            background: #bbdfc9;
            text-decoration: underline;
        }
        .note {
            background: #e6f4ea;
            border-radius: 20px;
            padding: 0.7rem;
            font-size: 0.85rem;
            color: #2b5e3b;
        }
    </style>
</head>
<body link="#1f6392" alink="#e67e22" vlink="#8e44ad">
<div class="card">
    <h1>Страница 3</h1>
    <div class="ring-link">
         <a href="1.html" title="Вернуться на страницу 1 (главная, начало кольца)">Перейти → Страница 1</a>
    </div>
    <div class="note"
    </div>
    <hr style="margin: 1rem 0;">
</div>
</body>
</html>
